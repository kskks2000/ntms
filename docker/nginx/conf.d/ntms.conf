# =====================================================================
# NTMS 사이트 설정
#
# 현재는 HTTP(80)만 활성화되어 있다.
# ACG 에서 80·443 개방이 승인되고 인증서를 발급받은 뒤
# 아래 HTTPS 블록의 주석을 해제하고 HTTP 는 리다이렉트로 바꾼다.
# =====================================================================

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    # 헬스체크 (인증서 없이도 동작해야 한다)
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Let's Encrypt HTTP-01 챌린지
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # --- 보안 헤더 ---------------------------------------------------
    add_header X-Frame-Options           "SAMEORIGIN"        always;
    add_header X-Content-Type-Options    "nosniff"           always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(self), camera=(self), microphone=()" always;

    # --- 로그인 (요청 제한 강하게) -----------------------------------
    location /api/auth/login {
        limit_req zone=login_limit burst=3 nodelay;

        proxy_pass         http://ntms_api/auth/login;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # --- API ---------------------------------------------------------
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;

        proxy_pass         http://ntms_api/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;   # 엑셀 대량 처리 여유
        proxy_buffering       off;    # SSE(실시간 관제) 대비
    }

    # --- 실시간 관제 (SSE / WebSocket) --------------------------------
    location /api/realtime/ {
        proxy_pass         http://ntms_api/realtime/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;     # 장시간 연결 유지
    }

    # --- Next.js 정적 자산 (해시 파일명 → 영구 캐시) --------------------
    location /_next/static/ {
        proxy_pass http://ntms_web;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # --- 웹 ----------------------------------------------------------
    location / {
        proxy_pass         http://ntms_web;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }
}

# =====================================================================
