# =====================================================================
# NTMS 사이트 설정
#
# 현재는 HTTP(80)만 활성화되어 있다.
# ACG 에서 80·443 개방이 승인되고 인증서를 발급받은 뒤
# 아래 HTTPS 블록의 주석을 해제하고 HTTP 는 리다이렉트로 바꾼다.
# =====================================================================

#
# `default_server` 를 반드시 명시한다.
#
# nginx 에서 `server_name _` 는 **catch-all 이 아니다.** `_` 는 어떤 Host 와도
# 안 겹치는 이름일 뿐이고, 이 블록이 그동안 모든 요청을 받은 것은 80 포트의
# **첫 번째** server 블록이라 자동으로 기본 서버였기 때문이다. 앞에 다른
# 블록을 하나 끼워 넣는 순간 기본 서버가 그쪽으로 넘어간다 — apex 리다이렉트
# 블록을 위에 뒀다가 www 도 IP 도 헬스체크도 전부 그 블록으로 떨어져
# 무한 리다이렉트가 났다. 이름을 안 적어서 생긴 사고가 아니라 **순서에
# 기대고 있었기 때문에** 생긴 사고다.
#
server {
    listen       80 default_server;
    listen       [::]:80 default_server;
    server_name  _;

    # 헬스체크 (인증서 없이도 동작해야 한다)
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Let's Encrypt HTTP-01 챌린지
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # --- 보안 헤더 ---------------------------------------------------
    add_header X-Frame-Options           "SAMEORIGIN"        always;
    add_header X-Content-Type-Options    "nosniff"           always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(self), camera=(self), microphone=()" always;

    # --- 모니터링 -----------------------------------------------------
    #
    # nginx-exporter 가 읽는 창구. 도커 네트워크 안에서만 열린다.
    # 밖에서 닿으면 커넥션 수와 처리량이 그대로 새어 나간다 — 서비스
    # 규모를 남에게 알려 줄 이유가 없다.
    location = /nginx-status {
        stub_status;
        access_log off;
        allow 172.16.0.0/12;   # 도커 브리지 대역
        allow 127.0.0.1;
        deny  all;
    }

    #
    # Grafana(grafana.aitestbed.kr · 180.210.77.62)가 조회하는 두 창구.
    #
    # **IP 로만 막고 basic auth 는 일부러 안 걸었다.** 지금 이 서버는 평문
    # HTTP 라, 인증을 걸면 15초마다 비밀번호가 그대로 흘러간다. 자격증명을
    # 평문으로 반복 전송하는 것보다 출발지 IP 하나로 막는 편이 낫다.
    # HTTPS 를 켜면 그때 basic auth 를 얹는다.
    #
    # Grafana 장비의 **아웃바운드** IP 가 DNS 의 A 레코드와 다를 수 있다
    # (NAT). 데이터소스 테스트가 403 이면 아래로 실제 출발지를 본다:
    #   docker exec ntms-nginx grep '/mon/' /var/log/nginx/access.log | tail
    #
    location /mon/prom/ {
        allow 180.210.77.62;
        deny  all;

        # 뒤의 슬래시가 핵심이다. /mon/prom/api/v1/query → /api/v1/query 로
        # 접혀 들어간다. 슬래시를 빼면 경로가 그대로 붙어 전부 404 가 된다.
        proxy_pass         http://prometheus:9090/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Drilldown 은 라벨을 훑느라 넓은 구간을 한 번에 묻는다.
        proxy_read_timeout 120s;
    }

    location /mon/loki/ {
        allow 180.210.77.62;
        deny  all;

        # Grafana 는 이 주소 뒤에 /loki/api/v1/... 을 스스로 붙인다.
        # 그래서 /mon/loki/loki/api/v1/... 로 들어와 /loki/api/v1/... 이 된다.
        proxy_pass         http://loki:3100/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # --- 로그인 (요청 제한 강하게) -----------------------------------
    location /api/auth/login {
        limit_req zone=login_limit burst=3 nodelay;

        proxy_pass         http://ntms_api/auth/login;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # --- API ---------------------------------------------------------
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;

        proxy_pass         http://ntms_api/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;   # 엑셀 대량 처리 여유
        proxy_buffering       off;    # SSE(실시간 관제) 대비
    }

    # --- 실시간 관제 (SSE / WebSocket) --------------------------------
    location /api/realtime/ {
        proxy_pass         http://ntms_api/realtime/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;     # 장시간 연결 유지
    }

    # --- Next.js 정적 자산 (해시 파일명 → 영구 캐시) --------------------
    location /_next/static/ {
        proxy_pass http://ntms_web;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # --- 웹 ----------------------------------------------------------
    location / {
        proxy_pass         http://ntms_web;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;

        # Next.js 는 next/font 로 받은 글꼴 파일을 전부 preload 하라는
        # `link:` 헤더 하나에 실어 보낸다. 한글은 유니코드 구간이 100개 넘게
        # 쪼개져 있어서 이 헤더 하나가 수십 KB 가 된다.
        #
        # nginx 기본 헤더 버퍼(4k)로는 담기지 않아 upstream 응답을 통째로
        # 버리고 502 를 낸다. 미리 만들어 둔(static) 경로는 헤더가 작아
        # 통과하고 동적 경로만 죽어서, 증상이 "특정 화면만 502" 로 보인다.
        proxy_buffer_size     64k;
        proxy_buffers       8 64k;
        proxy_busy_buffers_size 128k;
    }
}

# =====================================================================
# apex → www 정규화
#
# 같은 앱이 여러 이름으로 열리면 **이름마다 세션이 따로 생긴다.** 리프레시
# 쿠키에 domain 을 안 붙였기 때문에(host-only) qqq.ai.kr 에서 로그인한
# 사람이 www.qqq.ai.kr 로 옮기면 로그인 화면을 다시 본다. 링크를 주고받는
# 사이에 둘이 섞이면 "로그아웃이 자꾸 된다" 로 접수된다.
#
# 공인 IP 는 catch-all(server_name _) 에 그대로 남긴다 — 배포 검증
# (docker/deploy.sh)과 헬스체크가 IP 로 들어오므로 여기서 돌려보내면 안 된다.
#
# 이름을 바꾸면 이 블록과 아래 HTTPS 블록의 server_name 을 같이 고친다.
# =====================================================================
server {
    listen       80;
    listen       [::]:80;
    server_name  qqq.ai.kr;

    # 인증서 챌린지는 리다이렉트보다 먼저 받는다. apex 로도 발급이 돼야
    # 나중에 이름 둘을 한 인증서에 담을 수 있다.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # $scheme 을 쓴다. HTTPS 를 붙일 때 이 줄을 다시 고치지 않아도 된다.
    location / {
        return 301 $scheme://www.qqq.ai.kr$request_uri;
    }
}

# =====================================================================
# HTTPS — 인증서 발급 후 활성화
# ---------------------------------------------------------------------
# 1) ACG 에서 80·443 개방 확인
# 2) 아래 명령으로 인증서 발급
#      docker compose -f docker/docker-compose.yml run --rm certbot \
#        certonly --webroot -w /var/www/certbot \
#        -d tms.example.com --email admin@example.com --agree-tos --no-eff-email
# 3) 이 블록 주석 해제 + 위 server 블록의 location / 을 리다이렉트로 변경
#      return 301 https://$host$request_uri;
# 4) docker compose exec nginx nginx -s reload
# =====================================================================
#
# server {
#     listen       443 ssl;
#     listen       [::]:443 ssl;
#     http2        on;
#     server_name  tms.example.com;
#
#     ssl_certificate     /etc/letsencrypt/live/tms.example.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/tms.example.com/privkey.pem;
#
#     ssl_protocols             TLSv1.2 TLSv1.3;
#     ssl_prefer_server_ciphers off;
#     ssl_session_cache         shared:SSL:10m;
#     ssl_session_timeout       1d;
#     ssl_stapling              on;
#     ssl_stapling_verify       on;
#
#     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
#
#     # 위 server 블록의 location 들을 그대로 복사해 사용한다
# }
