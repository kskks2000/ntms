# =====================================================================
# NTMS 서버 배포 스택 (NAVER Cloud 단일 VM · vCPU 2 / RAM 16GB)
#
# 실행 (저장소 루트에서)
#   docker compose -f docker/docker-compose.yml --env-file .env up -d
#
# 주의
#   - postgres / redis 는 호스트 포트를 열지 않는다. 컨테이너 네트워크
#     내부에서만 접근한다. 외부 노출은 nginx(80/443)뿐이다.
#   - db/ddl/ 의 *.sql 과 *.sh 는 최초 기동 시 파일명 순서대로
#     자동 실행된다. (00_init → 01_enum → ... → 92_rls → 93_app_role)
#     이미 데이터가 있는 볼륨에서는 실행되지 않는다.
# =====================================================================

name: ntms

services:
  # -------------------------------------------------------------------
  # PostgreSQL 18
  # -------------------------------------------------------------------
  postgres:
    image: postgres:18-alpine
    container_name: ntms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ntms}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER 를 .env 에 설정하세요}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 .env 에 설정하세요}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=ko-KR"
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # 최초 기동 시 DDL 자동 적용 (파일명 사전순 실행).
      # 93_app_role.sh 가 같은 디렉터리에 있어 92_rls.sql 직후 실행된다.
      - ../db/ddl:/docker-entrypoint-initdb.d:ro
      - ../db/backup:/backup
    command:
      # 16GB / vCPU 2 기준 튜닝
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=8GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - max_connections=100
      - -c
      - random_page_cost=1.1          # SSD 기준
      - -c
      - effective_io_concurrency=200
      - -c
      - max_worker_processes=2
      - -c
      - max_parallel_workers=2
      - -c
      - max_parallel_workers_per_gather=1
      - -c
      - wal_compression=on
      - -c
      - log_min_duration_statement=1000  # 1초 이상 쿼리 기록
      - -c
      - timezone=Asia/Seoul
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 4G
    networks:
      - ntms-net

  # -------------------------------------------------------------------
  # Redis (세션 · BullMQ 큐)
  # -------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ntms-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD 를 .env 에 설정하세요}
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - noeviction          # 큐 데이터 유실 방지. 캐시 전용이면 allkeys-lru
      - --appendonly
      - "yes"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768M
    networks:
      - ntms-net

  # -------------------------------------------------------------------
  # Nest.js API
  # -------------------------------------------------------------------
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    image: ntms-api:latest
    container_name: ntms-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      TZ: Asia/Seoul
      # 반드시 ntms_app 으로 접속한다. POSTGRES_USER(슈퍼유저)로 붙으면
      # FORCE ROW LEVEL SECURITY 까지 우회되어 테넌트 격리가 조용히 사라진다.
      # 로그인 권한은 db/ddl/93_app_role.sh 가 부여한다.
      DATABASE_URL: postgresql://ntms_app:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ntms}?schema=ntms&connection_limit=20&pool_timeout=20
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET 를 .env 에 설정하세요}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET 를 .env 에 설정하세요}
      CORS_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2G
    networks:
      - ntms-net

  # -------------------------------------------------------------------
  # Next.js Web
  # -------------------------------------------------------------------
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_ORIGIN:-http://localhost}/api
    image: ntms-web:latest
    container_name: ntms-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      TZ: Asia/Seoul
      # 서버 컴포넌트에서 호출할 내부 주소 (컨테이너 네트워크)
      INTERNAL_API_URL: http://api:4000
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2G
    networks:
      - ntms-net

  # -------------------------------------------------------------------
  # Nginx (유일한 외부 노출 지점)
  # -------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: ntms-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-conf:/etc/letsencrypt:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - web
      - api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - ntms-net

  # -------------------------------------------------------------------
  # Certbot (TLS 인증서 발급/갱신)
  #   ACG 80 포트 개방 후에만 동작한다. 그 전까지는 기동하지 않는다.
  #   활성화: docker compose --profile tls up -d certbot
  # -------------------------------------------------------------------
  certbot:
    image: certbot/certbot:latest
    container_name: ntms-certbot
    profiles: ["tls"]
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do
               certbot renew --webroot -w /var/www/certbot --quiet;
               sleep 12h & wait $${!};
             done"
    networks:
      - ntms-net

volumes:
  postgres-data:
    name: ntms-postgres-data
  redis-data:
    name: ntms-redis-data
  certbot-www:
    name: ntms-certbot-www
  certbot-conf:
    name: ntms-certbot-conf
  nginx-logs:
    name: ntms-nginx-logs

networks:
  ntms-net:
    name: ntms-net
    driver: bridge
