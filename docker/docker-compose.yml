# =====================================================================
# NTMS 서버 배포 스택 (NAVER Cloud 단일 VM · vCPU 2 / RAM 16GB)
#
# 실행 (저장소 루트에서)
#   docker compose -f docker/docker-compose.yml --env-file .env up -d
#
# 주의
#   - 인터넷에 열리는 것은 nginx(80/443) 뿐이다.
#     redis 는 호스트 포트를 아예 열지 않고, postgres 만 127.0.0.1:15432 에
#     묶어 둔다. 루프백이라 외부에서는 닿지 않고, DB 도구는 SSH 터널로 붙는다.
#   - db/ddl/ 의 *.sql 과 *.sh 는 최초 기동 시 파일명 순서대로
#     자동 실행된다. (00_init → 01_enum → ... → 92_rls → 93_app_role)
#     이미 데이터가 있는 볼륨에서는 실행되지 않는다.
# =====================================================================

name: ntms

services:
  # -------------------------------------------------------------------
  # PostgreSQL 18
  # -------------------------------------------------------------------
  postgres:
    image: postgres:18-alpine
    container_name: ntms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ntms}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER 를 .env 에 설정하세요}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 .env 에 설정하세요}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=ko-KR"
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    ports:
      # DBeaver 등 외부 도구용 접속 지점. 반드시 127.0.0.1 에 묶는다.
      # 이걸 빼먹고 "15432:5432" 로 적으면 0.0.0.0 에 바인딩되어, ACG 설정이
      # 한 번 바뀌는 순간 DB 가 인터넷에 그대로 열린다.
      # 접속은 SSH 터널을 통해서만 한다:
      #   ssh -N -L 15432:localhost:15432 ntms
      #
      # 호스트 포트를 5432 가 아니라 15432 로 둔 이유는, 개발 PC 에 네이티브
      # PostgreSQL 이 이미 5432 를 쓰고 있어 로컬에서 스택이 뜨지 못하기 때문이다.
      - "127.0.0.1:15432:5432"
    volumes:
      # PostgreSQL 18 이미지는 PGDATA 가 /var/lib/postgresql/18/docker 다.
      # /var/lib/postgresql/data 에 마운트하면 엔트리포인트가 구버전 배치로
      # 판단해 기동을 거부한다. 볼륨은 반드시 한 단계 위에 건다.
      - postgres-data:/var/lib/postgresql
      # 최초 기동 시 DDL 자동 적용 (파일명 사전순 실행).
      # 93_app_role.sh 가 같은 디렉터리에 있어 92_rls.sql 직후 실행된다.
      #
      # 바인드 마운트의 :z 는 SELinux 재라벨링이다. 서버(Rocky 8)는 SELinux 가
      # enforcing 이라 이게 없으면 컨테이너가 호스트 파일을 읽지 못해 DDL 이
      # 통째로 건너뛰어진다. SELinux 가 없는 환경(Docker Desktop)에서는 무시된다.
      - ../db/ddl:/docker-entrypoint-initdb.d:ro,z
      - ../db/backup:/backup:z
    command:
      # 16GB / vCPU 2 기준 튜닝
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=8GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - max_connections=100
      - -c
      - random_page_cost=1.1          # SSD 기준
      - -c
      - effective_io_concurrency=200
      - -c
      - max_worker_processes=2
      - -c
      - max_parallel_workers=2
      - -c
      - max_parallel_workers_per_gather=1
      - -c
      - wal_compression=on
      - -c
      - log_min_duration_statement=1000  # 1초 이상 쿼리 기록
      - -c
      - timezone=Asia/Seoul
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 4G
    networks:
      - ntms-net

  # -------------------------------------------------------------------
  # Redis (세션 · BullMQ 큐)
  # -------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ntms-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD 를 .env 에 설정하세요}
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - noeviction          # 큐 데이터 유실 방지. 캐시 전용이면 allkeys-lru
      - --appendonly
      - "yes"
    environment:
      # 헬스체크의 redis-cli 가 읽는다. redis-cli 는 REDISCLI_AUTH 를 자동으로
      # 쓰므로 -a 로 넘길 필요가 없다. -a 는 컨테이너 프로세스 목록에
      # 비밀번호를 그대로 노출한다.
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768M
    networks:
      - ntms-net

  # -------------------------------------------------------------------
  # Nest.js API
  # -------------------------------------------------------------------
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    image: ntms-api:latest
    container_name: ntms-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      TZ: Asia/Seoul
      # 반드시 ntms_app 으로 접속한다. POSTGRES_USER(슈퍼유저)로 붙으면
      # FORCE ROW LEVEL SECURITY 까지 우회되어 테넌트 격리가 조용히 사라진다.
      # 로그인 권한은 db/ddl/93_app_role.sh 가 부여한다.
      DATABASE_URL: postgresql://ntms_app:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ntms}?schema=ntms&connection_limit=20&pool_timeout=20
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET 를 .env 에 설정하세요}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET 를 .env 에 설정하세요}
      CORS_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost}
      # HTTPS 를 붙이기 전까지는 .env 에서 false 로 내려야 세션이 유지된다
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      # 지도. 비워 두면 지도 자리에 안내 문구만 보인다
      NAVER_MAP_CLIENT_ID: ${NAVER_MAP_CLIENT_ID:-}
      NAVER_MAP_CLIENT_SECRET: ${NAVER_MAP_CLIENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2G
    networks:
      - ntms-net

  # -------------------------------------------------------------------
  # Next.js Web
  # -------------------------------------------------------------------
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_ORIGIN:-http://localhost}/api
    image: ntms-web:latest
    container_name: ntms-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      TZ: Asia/Seoul
      # 서버 컴포넌트에서 호출할 내부 주소 (컨테이너 네트워크)
      INTERNAL_API_URL: http://api:4000
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2G
    networks:
      - ntms-net

  # -------------------------------------------------------------------
  # Nginx (유일한 외부 노출 지점)
  # -------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: ntms-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro,z
      - ./nginx/conf.d:/etc/nginx/conf.d:ro,z
      - certbot-www:/var/www/certbot:ro
      - certbot-conf:/etc/letsencrypt:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - web
      - api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - ntms-net

  # -------------------------------------------------------------------
  # Certbot (TLS 인증서 발급/갱신)
  #   ACG 80 포트 개방 후에만 동작한다. 그 전까지는 기동하지 않는다.
  #   활성화: docker compose --profile tls up -d certbot
  # -------------------------------------------------------------------
  certbot:
    image: certbot/certbot:latest
    container_name: ntms-certbot
    profiles: ["tls"]
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do
               certbot renew --webroot -w /var/www/certbot --quiet;
               sleep 12h & wait $${!};
             done"
    networks:
      - ntms-net

  # ===================================================================
  # 모니터링
  #
  # 전부 ntms-net 안에만 산다. 호스트 포트를 여는 것은 여전히 nginx 뿐이고,
  # 밖에서 오는 조회는 nginx 의 /mon/prom/ · /mon/loki/ 로만 들어온다.
  # 그 두 경로는 Grafana 장비(180.210.77.62)의 IP 로만 열려 있다.
  #
  # 익스포터를 따로따로 두는 이유: 대상 하나가 안 보일 때 "익스포터가
  # 죽었나, 중간 수집기가 죽었나" 를 가르지 않아도 된다. 컨테이너 하나에
  # curl 한 번이면 어디까지 살아 있는지가 끝난다.
  # ===================================================================

  # --- 호스트 지표 ---------------------------------------------------
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: ntms-node-exporter
    restart: unless-stopped
    # 호스트의 프로세스 네임스페이스를 봐야 컨텍스트 스위치·부하 평균이
    # 컨테이너 것이 아니라 장비 것으로 나온다.
    pid: host
    command:
      - --path.rootfs=/host
      # 도커가 만드는 오버레이·바인드 마운트를 세면 디스크 사용률이 같은
      # 파티션을 수십 번 중복해 잡는다. 그 그래프는 못 쓴다.
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|var/lib/docker/.+)($|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|cgroup.*|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|mqueue|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$
    volumes:
      # rslave 라야 나중에 붙는 마운트까지 따라온다.
      - /:/host:ro,rslave
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - ntms-net

  # --- 컨테이너 지표 -------------------------------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: ntms-cadvisor
    restart: unless-stopped
    # 서버(Rocky 8)는 SELinux 가 enforcing 이다. privileged 없이는 cgroup 과
    # /var/lib/docker 를 못 읽어 컨테이너 지표가 통째로 빈다.
    privileged: true
    devices:
      - /dev/kmsg
    command:
      # 기본값(1초)은 2 vCPU 짜리 장비에서 cAdvisor 혼자 CPU 를 먹는다.
      - --housekeeping_interval=15s
      - --docker_only=true
      # 안 쓰는 수집기를 끈다. 이것만으로 메모리가 절반 아래로 내려간다.
      - --disable_metrics=percpu,sched,tcp,udp,advtcp,process,hugetlb,referenced_memory,cpu_topology,resctrl
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    deploy:
      resources:
        limits:
          memory: 384M
    networks:
      - ntms-net

  # --- PostgreSQL 지표 -----------------------------------------------
  postgres-exporter:
    # v0.15.0 은 PostgreSQL 18 에서 stat_bgwriter 수집기가 죽는다.
    # PG 17 부터 체크포인트 통계가 pg_stat_bgwriter 에서 pg_stat_checkpointer 로
    # 빠지면서 칸 이름까지 바뀌었는데(checkpoints_timed → num_timed), 옛 이름을
    # 계속 묻다가 15초마다 실패했다. 지표가 빠지는 것도 문제지만, 실패한 질의가
    # postgres 로그에 그대로 찍혀 **시간당 3천 줄**이 Loki 로 흘러들었다.
    image: prometheuscommunity/postgres-exporter:v0.18.0
    container_name: ntms-postgres-exporter
    restart: unless-stopped
    environment:
      # 전용 롤 ntms_exporter (pg_monitor 만 가진 읽기 전용).
      # 슈퍼유저로 붙이지 않는다 — 지표를 보려고 만든 접속이 데이터를
      # 고칠 수 있으면 그건 더 이상 모니터링이 아니다.
      DATA_SOURCE_NAME: >-
        postgresql://ntms_exporter:${POSTGRES_EXPORTER_PASSWORD:?POSTGRES_EXPORTER_PASSWORD 를 .env 에 설정하세요}@postgres:5432/${POSTGRES_DB:-ntms}?sslmode=disable
      PG_EXPORTER_EXCLUDE_DATABASES: template0,template1
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - ntms-net

  # --- Redis 지표 -----------------------------------------------------
  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: ntms-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD 를 .env 에 설정하세요}
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M
    networks:
      - ntms-net

  # --- nginx 지표 -----------------------------------------------------
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: ntms-nginx-exporter
    restart: unless-stopped
    command:
      # stub_status 창구. conf.d/ntms.conf 의 /nginx-status 이고, 도커
      # 네트워크 안에서만 열려 있다.
      - --nginx.scrape-uri=http://nginx:80/nginx-status
    depends_on:
      - nginx
    deploy:
      resources:
        limits:
          memory: 64M
    networks:
      - ntms-net

  # --- 지표 저장 ------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: ntms-prometheus
    restart: unless-stopped
    user: root
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 15일. 더 길게 두려면 디스크부터 본다 — 대상 6개에 15초 간격이면
      # 하루 100MB 안팎이다.
      - --storage.tsdb.retention.time=15d
      # Grafana 는 API 만 쓰지만, 사람이 /mon/prom/ 을 브라우저로 열었을 때
      # 화면 안의 링크가 깨지지 않게 외부 주소를 알려 준다.
      - --web.external-url=http://www.qqq.ai.kr/mon/prom/
      - --web.route-prefix=/
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - prometheus-data:/prometheus
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - ntms-net

  # --- 로그 저장 ------------------------------------------------------
  loki:
    image: grafana/loki:3.3.2
    container_name: ntms-loki
    restart: unless-stopped
    user: root
    command:
      - -config.file=/etc/loki/loki.yml
    volumes:
      - ./monitoring/loki.yml:/etc/loki/loki.yml:ro,z
      - loki-data:/loki
    deploy:
      resources:
        limits:
          memory: 768M
    networks:
      - ntms-net

  # --- 로그 수집 ------------------------------------------------------
  alloy:
    image: grafana/alloy:v1.5.1
    container_name: ntms-alloy
    restart: unless-stopped
    # 도커 소켓은 root 소유다. 소켓을 읽어야 컨테이너 로그를 붙잡을 수 있다.
    user: root
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./monitoring/alloy.alloy:/etc/alloy/config.alloy:ro,z
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          memory: 384M
    networks:
      - ntms-net

volumes:
  postgres-data:
    name: ntms-postgres-data
  redis-data:
    name: ntms-redis-data
  certbot-www:
    name: ntms-certbot-www
  certbot-conf:
    name: ntms-certbot-conf
  nginx-logs:
    name: ntms-nginx-logs
  prometheus-data:
    name: ntms-prometheus-data
  loki-data:
    name: ntms-loki-data
  alloy-data:
    name: ntms-alloy-data

networks:
  ntms-net:
    name: ntms-net
    driver: bridge
